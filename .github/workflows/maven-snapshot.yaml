---
# The workflow to deploy snapshot artifact versions to GitHub packages
# Fill free to adjust java version and additional mvn command-line parameters
# The workflow will trigger on pushes into branches different from main and release
# Please make sure that the version in the pom.xml file has the SNAPSHOT postfix

name: Maven snapshot deploy

on:
  push:
    branches-ignore:
      - "main"
      - "**release*"
      - "prettier/**"
      - "dependabot/**"
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: maven-snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mvn-snapshot-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy Maven Snapshot
        uses: netcracker/qubership-workflow-hub/actions/maven-snapshot-deploy@288a6a0d9a78e80dfdefccab1be6497a39deb746 # v2.8.0
        with:
          java-version: "21"
          maven-version: "3.9.10"
          maven-command: deploy
          additional-mvn-args: >-
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/Netcracker/qubership-graylog-archiving-plugin
          target-store: "github"
          maven-username: ${{ github.actor }}
          maven-token: ${{ github.token }}
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
